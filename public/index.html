<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#474FEC" />
    <meta
      name="description"
      content="Oskar Borkenhagens Developer Page - Portfolio, Skills, and more."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/assets/images/code.svg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Ostabo Developer Page</title>

    <meta content="https://ostabo.com" property="og:url"/>
    <meta content="website" property="og:type"/>
    <meta content="Ostabo Developer Page" property="og:title"/>
    <meta content="Developer page of Oskar Borkenhagen - Software Engineer" property="og:description"/>
    <meta content="%PUBLIC_URL%/logo512.png" property="og:image:secure_url"/>
    <meta content="%PUBLIC_URL%/logo512.png" property="og:image"/>
    <meta content="512" property="og:image:width"/>
    <meta content="512" property="og:image:height"/>
    <meta content="en_US" property="og:locale"/>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
